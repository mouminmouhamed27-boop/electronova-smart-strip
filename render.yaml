services:
  - type: web
    name: electronova-smart-strip
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MQTT_BROKER_URL
        value: mqtts://geeae33e.ala.eu-central-1.emqxsl.com:8883
      - key: MQTT_DEVICE_ID
        value: EN_SIM1
      - key: MQTT_TLS_REJECT_UNAUTHORIZED
        value: "false"
      - key: DEFAULT_TARIFF_EGP
        value: "1.25"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
